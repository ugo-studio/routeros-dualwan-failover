name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: pip install markdown==3.11
      - name: Rebuild generated files
        run: python3 tools/build.py && python3 tools/build_html.py
      - name: Generated files are up to date
        run: git diff --exit-code -- dist docs
      - name: Secret scan
        run: python3 tools/check_secrets.py
